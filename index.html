<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE BUILD // 2026 // PHOTOREALISTIC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-panel: #070707;
            --bg-hover: #0a0a0a;
            --border-color: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-base); color: var(--text-primary);
            min-height: 100vh; display: flex; justify-content: center;
            padding-top: 40px; padding-bottom: 40px;
        }

        .app-container { width: 100%; max-width: 1300px; padding: 0 20px; }

        header {
            margin-bottom: 30px; display: flex; justify-content: space-between;
            align-items: flex-end; border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header-title h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 5px 0; }
        .header-title p { color: var(--text-secondary); margin: 0; font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }

        .grid-layout { display: grid; grid-template-columns: 320px 1fr 320px; gap: 24px; height: 700px; }
        @media (max-width: 1024px) { .grid-layout { grid-template-columns: 1fr; height: auto; } }

        /* 3D Canvas */
        .canvas-container {
            background-color: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 6px; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center; min-height: 500px;
        }
        
        #three-canvas { width: 100%; height: 100%; display: block; }
        .canvas-overlay { position: absolute; top: 20px; left: 20px; z-index: 2; pointer-events: none; }
        .canvas-overlay h2 { margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--text-secondary); letter-spacing: 2px; }
        .canvas-instruction { position: absolute; bottom: 20px; width: 100%; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-secondary); opacity: 0.5; z-index: 2; pointer-events: none; }

        /* Panels */
        .panel { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; overflow-y: auto; }
        .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); position: sticky; top: 0; background: var(--bg-panel); z-index: 10; }
        .part-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border-color); }
        .part-item:hover { background-color: var(--bg-hover); }
        .part-info { display: flex; flex-direction: column; gap: 4px; }
        .part-category { font-size: 0.65rem; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        .part-name { font-size: 0.85rem; font-weight: 500; }

        /* Stats */
        .stat-block { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .stat-label { font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); margin-bottom: 8px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: baseline; gap: 10px; }
        .stat-value span.sub { font-size: 0.85rem; font-weight: 400; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; }
        .progress-track { width: 100%; height: 4px; background-color: var(--border-color); border-radius: 2px; margin-top: 12px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #ef4444; width: 100%; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-title">
                <h1>Ultimate Build</h1>
                <p>Config.v1 // Photorealistic 3D</p>
            </div>
        </header>

        <div class="grid-layout">
            <div class="panel">
                <div class="panel-header">Components</div>
                <div class="part-list" id="parts-container"></div>
            </div>

            <div class="canvas-container" id="canvas-container">
                <div class="canvas-overlay">
                    <h2>AI Texture Mapping</h2>
                </div>
                <div class="canvas-instruction">
                    [ CLICK & DRAG TO ROTATE // SCROLL TO ZOOM ]
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Telemetry</div>
                <div class="stat-block">
                    <div class="stat-label">Total Est. Cost</div>
                    <div class="stat-value" id="total-price">$0</div>
                    <div class="progress-track"><div class="progress-fill"></div></div>
                </div>
                <div class="stat-block" style="border-bottom: none;">
                    <div class="stat-label">3DMark Estimate</div>
                    <div class="stat-value" style="color: #ef4444;">36,500 <span class="sub">Time Spy</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inject Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Populate Parts
        const parts = [
            { category: 'CPU', name: 'AMD Ryzen 7 9800X3D', price: 440 },
            { category: 'GPU', name: 'NVIDIA RTX 5090 32GB', price: 1999 },
            { category: 'MOBO', name: 'MSI X870 MAG TOMAHAWK WIFI', price: 230 },
            { category: 'RAM', name: '32GB DDR5-6000 CL30', price: 115 },
            { category: 'STORAGE', name: 'Samsung 990 Pro 2TB NVMe', price: 170 },
            { category: 'COOLING', name: 'TRYX PANORAMA SE 360mm', price: 250 },
            { category: 'POWER', name: 'Corsair RM1000e (2025)', price: 145 },
            { category: 'CHASSIS', name: 'Lian Li O11 Dynamic EVO RGB', price: 160 },
            { category: 'FANS', name: 'Lian Li SL-Infinity (x6)', price: 150 }
        ];

        const container = document.getElementById('parts-container');
        let total = 0;
        parts.forEach((part) => {
            total += part.price;
            container.insertAdjacentHTML('beforeend', `
                <div class="part-item">
                    <div class="part-info">
                        <div class="part-category">${part.category}</div>
                        <div class="part-name">${part.name}</div>
                    </div>
                    <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--text-secondary);">$${part.price}</div>
                </div>
            `);
        });
        document.getElementById('total-price').innerText = '$' + total.toLocaleString();

        // --- 3D Engine Setup ---
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.05);
        
        const camera = new THREE.PerspectiveCamera(40, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
        camera.position.set(5, 3, 6); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        canvasContainer.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        const pcGroup = new THREE.Group();
        scene.add(pcGroup);

        // --- Texture Loading ---
        const textureLoader = new THREE.TextureLoader();
        const moboTex = textureLoader.load('assets/mobo_tex.jpg');
        const gpuTex = textureLoader.load('assets/gpu_tex.jpg');
        const fanTex = textureLoader.load('assets/fan_tex.jpg');

        // Materials
        const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.4 });
        const glassMaterial = new THREE.MeshPhysicalMaterial({ 
            color: 0x0a0a0a, metalness: 0.2, roughness: 0.1, 
            transparent: true, opacity: 0.2, transmission: 0.5, clearcoat: 1.0
        });

        // --- 1. The Lian Li Case (Glass + Metal Frame) ---
        const caseWidth = 2.4, caseHeight = 3.2, caseDepth = 3.4;
        
        const base = new THREE.Mesh(new THREE.BoxGeometry(caseWidth + 0.1, 0.1, caseDepth + 0.1), darkMetal);
        base.position.y = -caseHeight/2 - 0.05;
        base.receiveShadow = true;
        pcGroup.add(base);

        const roof = new THREE.Mesh(new THREE.BoxGeometry(caseWidth + 0.1, 0.1, caseDepth + 0.1), darkMetal);
        roof.position.y = caseHeight/2 + 0.05;
        roof.castShadow = true;
        pcGroup.add(roof);

        const glassGeom = new THREE.BoxGeometry(caseWidth, caseHeight, caseDepth);
        const pcCase = new THREE.Mesh(glassGeom, glassMaterial);
        const caseEdges = new THREE.LineSegments(new THREE.EdgesGeometry(glassGeom), new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 2 }));
        pcGroup.add(pcCase);
        pcGroup.add(caseEdges);

        // --- 2. Motherboard (Photorealistic Texture mapped) ---
        // Create a plane for the high-res motherboard image
        const moboPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(2.3, 2.7), 
            new THREE.MeshStandardMaterial({ map: moboTex, roughness: 0.6 })
        );
        moboPlane.position.set(-1.15, 0, 0); 
        moboPlane.rotation.y = Math.PI / 2; // Face sideways
        moboPlane.rotation.z = -Math.PI / 2; // Orient correctly
        pcGroup.add(moboPlane);
        
        // Backing block for shadows
        const moboBlock = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.7, 2.3), darkMetal);
        moboBlock.position.set(-1.18, 0, 0);
        moboBlock.castShadow = true;
        moboBlock.receiveShadow = true;
        pcGroup.add(moboBlock);

        // --- 3. RTX 5090 GPU (Photorealistic Texture mapped) ---
        const gpuGroup = new THREE.Group();
        gpuGroup.position.set(-0.6, -0.4, 0.2);

        // 3D Block for volume
        const gpuBlock = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 2.5), darkMetal);
        gpuBlock.castShadow = true;
        gpuGroup.add(gpuBlock);

        // Plane for the high-res side profile texture
        const gpuSide = new THREE.Mesh(
            new THREE.PlaneGeometry(2.5, 0.5),
            new THREE.MeshStandardMaterial({ map: gpuTex, roughness: 0.4 })
        );
        gpuSide.position.set(0.26, 0, 0); // slightly offset from the block face
        gpuSide.rotation.y = Math.PI / 2;
        gpuGroup.add(gpuSide);

        pcGroup.add(gpuGroup);

        // --- 4. Fans (Photorealistic Texture mapped) ---
        const fans = [];
        const createFan = (x, y, z, rotX, rotY, rotZ) => {
            const fanGroup = new THREE.Group();
            fanGroup.position.set(x, y, z);
            fanGroup.rotation.set(rotX, rotY, rotZ);

            // Plane mapped with the glowing fan image
            const fanMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(0.8, 0.8),
                new THREE.MeshBasicMaterial({ map: fanTex, transparent: true })
            );
            
            // Add a dark backing so it's not invisible from behind
            const backing = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.05),
                darkMetal
            );
            backing.position.z = -0.03;

            fanGroup.add(fanMesh);
            fanGroup.add(backing);
            fans.push(fanMesh); // Push the mesh itself so we can spin it!
            pcGroup.add(fanGroup);
        };

        // Bottom intake fans
        for(let i=0; i<3; i++) createFan(0, -1.5, -1.1 + i*1.1, -Math.PI/2, 0, 0);
        // Side intake fans
        for(let i=0; i<3; i++) createFan(-1.0, -0.8 + i*0.9, -1.2, 0, Math.PI/2, 0);

        // --- 5. Advanced Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff, 1.5);
        spotLight.position.set(4, 6, 4);
        spotLight.castShadow = true;
        scene.add(spotLight);

        // Floor Grid
        const grid = new THREE.GridHelper(10, 20, 0x333333, 0x111111);
        grid.position.y = -1.8;
        scene.add(grid);

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Spin the textures of the fans!
            fans.forEach(fanMesh => { 
                fanMesh.rotation.z -= 0.15; 
            });

            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const width = canvasContainer.clientWidth;
            const height = canvasContainer.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
