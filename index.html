<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE BUILD // FPS ESTIMATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-panel: #070707;
            --bg-hover: #0a0a0a;
            --border-color: #1a1a1a;
            --border-hover: #333333;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.5);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-base); color: var(--text-primary);
            min-height: 100vh; display: flex; justify-content: center;
            padding-top: 40px; padding-bottom: 40px;
        }

        .app-container { width: 100%; max-width: 1100px; padding: 0 20px; }

        header {
            margin-bottom: 30px; display: flex; justify-content: space-between;
            align-items: flex-end; border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header-title h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 5px 0; }
        .header-title p { color: var(--text-secondary); margin: 0; font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }

        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); }
        .status-dot { width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent-glow); animation: pulse 2s infinite;}
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .grid-layout { display: grid; grid-template-columns: 1fr 400px; gap: 24px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

        /* Panels */
        .panel { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); background: var(--bg-panel); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between;}
        
        .part-item { padding: 16px 20px; border-bottom: 1px solid var(--border-color); transition: all 0.2s ease; }
        .part-item:hover { background-color: var(--bg-hover); }
        .part-item:last-child { border-bottom: none; }

        .part-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .part-category { font-size: 0.7rem; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        .part-price { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--accent); }

        /* Custom Select */
        select {
            width: 100%; background-color: #000000; color: #ffffff;
            border: 1px solid var(--border-color); padding: 10px 12px;
            font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500;
            border-radius: 4px; appearance: none; outline: none; cursor: pointer;
            transition: border-color 0.2s;
        }
        select:hover { border-color: var(--border-hover); }
        select:focus { border-color: var(--text-secondary); }
        
        /* Stats */
        .stat-block { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .stat-block:last-child { border-bottom: none; }
        .stat-label { font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;}
        
        .stat-value { font-size: 2.2rem; font-weight: 700; color: var(--text-primary); letter-spacing: -1px; }
        .stat-value.score { color: var(--accent); }
        .stat-value span.sub { font-size: 0.85rem; font-weight: 400; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; letter-spacing: normal;}
        
        .progress-track { width: 100%; height: 4px; background-color: var(--border-color); border-radius: 2px; margin-top: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--accent); width: 0%; transition: width 0.5s ease-out; }

        /* FPS Grid */
        .fps-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        
        .fps-card {
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .fps-res { font-size: 0.65rem; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        .fps-val { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .fps-val span { font-size: 0.8rem; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-weight: 400; }

        .game-select-container { margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-title">
                <h1>Ultimate Build</h1>
                <p>Config.v3 // Live FPS Estimator</p>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                TELEMETRY ACTIVE
            </div>
        </header>

        <div class="grid-layout">
            <!-- Builder Panel -->
            <div class="panel">
                <div class="panel-header">Part Selection</div>
                <div id="builder-container"></div>
            </div>

            <!-- Telemetry Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>Performance Analytics</span>
                    <span id="display-price" style="color: var(--accent);">$0</span>
                </div>
                
                <div class="stat-block">
                    <div class="stat-label">3DMark Time Spy Estimate</div>
                    <div class="stat-value score" id="display-score">0</div>
                    <div class="progress-track">
                        <div class="progress-fill" id="score-bar"></div>
                    </div>
                </div>

                <div class="stat-block">
                    <div class="stat-label" style="margin-bottom: 15px;">In-Game FPS Estimator (DLSS Quality)</div>
                    <div class="game-select-container" style="display: flex; gap: 10px;">
                        <select id="game-selector" onchange="updateTelemetry()" style="flex: 2;">
                            <option value="cyberpunk">Cyberpunk 2077</option>
                            <option value="warzone">Call of Duty: Warzone 2.0</option>
                            <option value="msfs">Microsoft Flight Simulator</option>
                            <option value="cs2">Counter-Strike 2</option>
                            <option value="fortnite">Fortnite</option>
                            <option value="valorant">Valorant</option>
                            <option value="roblox_dahood">Roblox (Da Hood)</option>
                            <option value="roblox_hoodcustoms">Roblox (Hood Customs)</option>
                            <option value="roblox_heavy">Roblox (Frontlines / Heavy)</option>
                            <option value="roblox_standard">Roblox (Blox Fruits / Standard)</option>
                            <option value="roblox_uncapped">Roblox (Uncapped / Lobby)</option>
                        </select>
                        <select id="preset-selector" onchange="updateTelemetry()" style="flex: 1;">
                            <option value="ultra">Ultra / High</option>
                            <option value="low">Competitive / Low</option>
                        </select>
                    </div>
                    
                    <div class="fps-grid">
                        <div class="fps-card">
                            <div class="fps-res" id="label-1080">1080p High</div>
                            <div class="fps-val" id="fps-1080">0 <span>FPS</span></div>
                        </div>
                        <div class="fps-card">
                            <div class="fps-res" id="label-1440">1440p Ultra</div>
                            <div class="fps-val" id="fps-1440">0 <span>FPS</span></div>
                        </div>
                        <div class="fps-card">
                            <div class="fps-res" id="label-4k">4K Ultra</div>
                            <div class="fps-val" id="fps-4k">0 <span>FPS</span></div>
                        </div>
                        <div class="fps-card" style="border-color: #333;">
                            <div class="fps-res" id="label-4k-rt" style="color: #ef4444;">4K Path Tracing</div>
                            <div class="fps-val" id="fps-4k-rt">0 <span>FPS</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Database (Reordered so ultimate build is index 0) ---
        const db = {
            cpu: [
                { id: 'c_9800x3d', name: 'AMD Ryzen 7 9800X3D', price: 440, score: 17000 },
                { id: 'c_9950x', name: 'AMD Ryzen 9 9950X', price: 650, score: 24000 },
                { id: 'c_7950x3d', name: 'AMD Ryzen 9 7950X3D', price: 600, score: 23500 },
                { id: 'c_7800x3d', name: 'AMD Ryzen 7 7800X3D', price: 350, score: 13500 },
                { id: 'c_14900k', name: 'Intel Core i9-14900K', price: 550, score: 21000 }
            ],
            gpu: [
                { id: 'g_5090', name: 'NVIDIA RTX 5090 32GB', price: 1999, score: 41000 },
                { id: 'g_5080', name: 'NVIDIA RTX 5080 16GB', price: 1199, score: 29500 },
                { id: 'g_4090', name: 'NVIDIA RTX 4090 24GB', price: 1799, score: 36000 },
                { id: 'g_4080s', name: 'NVIDIA RTX 4080 Super', price: 999, score: 28000 },
                { id: 'g_7900xtx', name: 'AMD Radeon RX 7900 XTX', price: 899, score: 29000 }
            ],
            mobo: [
                { id: 'm_tomax870', name: 'MSI X870 MAG TOMAHAWK WIFI', price: 230 },
                { id: 'm_godlike', name: 'MSI MEG X870E GODLIKE', price: 1200 },
                { id: 'm_hero', name: 'ASUS ROG CROSSHAIR X870E HERO', price: 700 }
            ],
            ram: [
                { id: 'r_32_6000', name: '32GB (2x16GB) DDR5-6000 CL30', price: 115 },
                { id: 'r_64_6000', name: '64GB (2x32GB) DDR5-6000 CL30', price: 210 },
                { id: 'r_96_6400', name: '96GB (2x48GB) DDR5-6400 CL32', price: 350 }
            ],
            storage: [
                { id: 's_990_2tb', name: 'Samsung 990 Pro 2TB NVMe', price: 170 },
                { id: 's_990_1tb', name: 'Samsung 990 Pro 1TB NVMe', price: 110 },
                { id: 's_990_4tb', name: 'Samsung 990 Pro 4TB NVMe', price: 320 }
            ],
            cooling: [
                { id: 'cool_tryx', name: 'TRYX PANORAMA SE 360mm', price: 250 },
                { id: 'cool_kraken', name: 'NZXT Kraken Elite 360', price: 280 },
                { id: 'cool_arctic', name: 'Arctic Liquid Freezer III 360', price: 120 }
            ],
            psu: [
                { id: 'p_1000e', name: 'Corsair RM1000e (2025)', price: 145 },
                { id: 'p_1600i', name: 'Corsair AX1600i', price: 600 },
                { id: 'p_850e', name: 'Corsair RM850e', price: 120 }
            ],
            case: [
                { id: 'case_evo', name: 'Lian Li O11 Dynamic EVO RGB', price: 160 },
                { id: 'case_vision', name: 'Lian Li O11 Vision', price: 140 },
                { id: 'case_north', name: 'Fractal Design North', price: 140 }
            ]
        };

        const categories = [
            { key: 'cpu', label: 'CPU' }, { key: 'gpu', label: 'Graphics Card' },
            { key: 'mobo', label: 'Motherboard' }, { key: 'ram', label: 'Memory' },
            { key: 'storage', label: 'Storage' }, { key: 'cooling', label: 'CPU Cooler' },
            { key: 'psu', label: 'Power Supply' }, { key: 'case', label: 'Chassis' }
        ];

        // --- 2. State Management & Restore Fix ---
        let savedState = {};
        try { savedState = JSON.parse(localStorage.getItem('dynamicBuildState')) || {}; } catch (e) {}
        
        const state = {};
        categories.forEach(cat => {
            const savedId = savedState[cat.key];
            const exists = db[cat.key].some(item => item.id === savedId);
            // If it doesn't exist (or wasn't saved), default to index 0 (which is now the ultimate build)
            state[cat.key] = exists ? savedId : db[cat.key][0].id; 
        });

        // --- 3. Render Selectors ---
        const container = document.getElementById('builder-container');
        categories.forEach(cat => {
            let optionsHTML = '';
            db[cat.key].forEach(item => {
                const isSelected = state[cat.key] === item.id ? 'selected' : '';
                optionsHTML += `<option value="${item.id}" ${isSelected}>${item.name}</option>`;
            });

            const html = `
                <div class="part-item">
                    <div class="part-header">
                        <div class="part-category">${cat.label}</div>
                        <div class="part-price" id="price-${cat.key}">$0</div>
                    </div>
                    <select id="select-${cat.key}" onchange="handleSelect('${cat.key}')">
                        ${optionsHTML}
                    </select>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });

        // --- 4. Game Profiles & FPS Math ---
        // Base FPS is benchmarked roughly against an RTX 4090 (Score: 36000) and 7800X3D (Score: 13500)
        const gameProfiles = {
            cyberpunk: { name: 'Cyberpunk 2077', base1080: 210, base1440: 160, base4k: 95, base4kRT: 55, cpuLimit: 240, lowMult: 1.8 },
            warzone: { name: 'Call of Duty: Warzone', base1080: 310, base1440: 250, base4k: 160, base4kRT: 0, cpuLimit: 350, lowMult: 1.6 },
            msfs: { name: 'Microsoft Flight Simulator', base1080: 140, base1440: 120, base4k: 85, base4kRT: 0, cpuLimit: 150, lowMult: 1.5 },
            cs2: { name: 'Counter-Strike 2', base1080: 750, base1440: 600, base4k: 350, base4kRT: 0, cpuLimit: 900, lowMult: 1.3 },
            fortnite: { name: 'Fortnite', base1080: 350, base1440: 280, base4k: 160, base4kRT: 0, cpuLimit: 450, lowMult: 2.2 },
            valorant: { name: 'Valorant', base1080: 800, base1440: 700, base4k: 450, base4kRT: 0, cpuLimit: 1000, lowMult: 1.2 },
            roblox_dahood: { name: 'Roblox (Da Hood)', base1080: 450, base1440: 400, base4k: 250, base4kRT: 0, cpuLimit: 550, lowMult: 1.4 },
            roblox_hoodcustoms: { name: 'Roblox (Hood Customs)', base1080: 400, base1440: 350, base4k: 220, base4kRT: 0, cpuLimit: 500, lowMult: 1.4 },
            roblox_heavy: { name: 'Roblox (Frontlines)', base1080: 240, base1440: 200, base4k: 140, base4kRT: 0, cpuLimit: 300, lowMult: 1.3 },
            roblox_standard: { name: 'Roblox (Standard)', base1080: 500, base1440: 450, base4k: 300, base4kRT: 0, cpuLimit: 600, lowMult: 1.5 },
            roblox_uncapped: { name: 'Roblox (Lobby)', base1080: 1400, base1440: 1400, base4k: 1200, base4kRT: 0, cpuLimit: 2000, lowMult: 1.0 }
        };

        function calculateFPS(gameKey, preset, gpuScore, cpuScore, isAMD) {
            const game = gameProfiles[gameKey];
            const gpuRatio = gpuScore / 36000; // Relative to RTX 4090
            const cpuRatio = cpuScore / 13500; // Relative to 7800X3D
            
            // X3D processors get a massive gaming boost that TimeSpy doesn't capture well, so artificially bump CPU ratio
            const adjustedCpuRatio = (state.cpu.includes('x3d') || state.cpu.includes('X3D')) ? cpuRatio * 1.3 : cpuRatio;

            const mult = preset === 'low' ? game.lowMult : 1.0;
            const cpuLimitCurrent = game.cpuLimit * adjustedCpuRatio * (preset === 'low' ? 1.2 : 1.0);

            let fps1080 = Math.floor(Math.min(game.base1080 * gpuRatio * mult, cpuLimitCurrent));
            let fps1440 = Math.floor(Math.min(game.base1440 * gpuRatio * mult, cpuLimitCurrent * 1.1));
            let fps4k = Math.floor(game.base4k * gpuRatio * mult);
            let fps4kRT = game.base4kRT > 0 ? Math.floor(game.base4kRT * gpuRatio) : 0;

            if (preset === 'low') fps4kRT = 0; // RT disabled on low

            // Penalty for AMD GPUs in heavy Path Tracing (RTX Overdrive)
            if (isAMD && fps4kRT > 0) {
                fps4kRT = Math.floor(fps4kRT * 0.4); 
            }

            return { fps1080, fps1440, fps4k, fps4kRT };
        }

        // --- 5. Main Logic Loop ---
        function handleSelect(categoryKey) {
            const selectEl = document.getElementById(`select-${categoryKey}`);
            state[categoryKey] = selectEl.value;
            localStorage.setItem('dynamicBuildState', JSON.stringify(state));
            updateTelemetry();
        }

        function updateTelemetry() {
            let totalPrice = 0;
            let gpuScore = 0;
            let cpuScore = 0;
            let isAMD = false;

            categories.forEach(cat => {
                const selectedId = state[cat.key];
                const item = db[cat.key].find(i => i.id === selectedId);
                
                totalPrice += item.price;
                document.getElementById(`price-${cat.key}`).innerText = '$' + item.price;

                if (cat.key === 'gpu') {
                    gpuScore = item.score;
                    if (item.name.includes('Radeon')) isAMD = true;
                }
                if (cat.key === 'cpu') cpuScore = item.score;
            });

            // Update Price & 3DMark
            document.getElementById('display-price').innerText = '$' + totalPrice.toLocaleString();
            const overallScore = Math.floor(1 / ((0.85 / gpuScore) + (0.15 / cpuScore)));
            document.getElementById('display-score').innerText = overallScore.toLocaleString();
            document.getElementById('score-bar').style.width = `${Math.min((overallScore / 45000) * 100, 100)}%`;

            // Update FPS
            const gameKey = document.getElementById('game-selector').value;
            const preset = document.getElementById('preset-selector').value;
            const fps = calculateFPS(gameKey, preset, gpuScore, cpuScore, isAMD);
            
            document.getElementById('fps-1080').innerHTML = `${fps.fps1080} <span>FPS</span>`;
            document.getElementById('fps-1440').innerHTML = `${fps.fps1440} <span>FPS</span>`;
            document.getElementById('fps-4k').innerHTML = `${fps.fps4k} <span>FPS</span>`;
            
            document.getElementById('label-1080').innerText = preset === 'low' ? '1080p Low' : '1080p High';
            document.getElementById('label-1440').innerText = preset === 'low' ? '1440p Low' : '1440p Ultra';
            document.getElementById('label-4k').innerText = preset === 'low' ? '4K Low' : '4K Ultra';

            if (fps.fps4kRT > 0) {
                document.getElementById('fps-4k-rt').innerHTML = `${fps.fps4kRT} <span>FPS</span>`;
                document.getElementById('label-4k-rt').innerText = '4K Path Tracing';
            } else {
                document.getElementById('fps-4k-rt').innerHTML = `N/A`;
                document.getElementById('label-4k-rt').innerText = preset === 'low' ? 'Ray Tracing Off' : '4K Path Tracing';
            }
        }

        updateTelemetry();
    </script>
</body>
</html>
